<h1>Produse</h1>

@for (product of products; track product.id) {
  <article>
    <h2>{{ product.name }}</h2>
    <p>{{ product.price }} €</p>
    <a [routerLink]="['/products', product.id]">Vezi detalii</a>
  </article>
}
<button (click)="selectCategory('')">Toate</button>
<button (click)="selectCategory('Miere')">Miere</button>
<button (click)="selectCategory('Echipamente')">Echipamente</button>

<label for="product-search">Caută produse</label>
<input
  id="product-search"
  type="search"
  (input)="onSearch($event)"
  placeholder="De exemplu: salcâm"
/>
